[package]
name = "pathman"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Cross-platform GUI for editing user and system PATH"
license = "MIT"

[build-dependencies]
chrono = "0.4"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "6"
open = "5"
eframe = { version = "0.29", default-features = true }
egui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(not(windows))'.dependencies]
shellexpand = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_UI_WindowsAndMessaging",
] }

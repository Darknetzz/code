[package]
name = "hash-zero"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "CLI for finding and verifying hashes with leading or trailing zeroes"
license = "MIT"

[[bin]]
name = "hash-zero"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

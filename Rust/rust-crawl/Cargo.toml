[package]
name = "rust-crawl"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Web crawler/downloader CLI (Rust port of Python/pycrawl)"
license = "MIT"

[[bin]]
name = "rust-crawl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
url = "2"

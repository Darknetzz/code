[package]
name = "superping"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Feature-rich ICMP/TCP ping CLI"
license = "MIT"

[[bin]]
name = "superping"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
hickory-proto = "0.24"
hickory-resolver = "0.24"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
surge-ping = "0.8"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }

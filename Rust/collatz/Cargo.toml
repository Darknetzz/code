[package]
name = "collatz"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Collatz conjecture CLI for arbitrary-size integers"
license = "MIT"

[[bin]]
name = "collatz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
malachite = { version = "0.4", default-features = false, features = ["naturals_and_integers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

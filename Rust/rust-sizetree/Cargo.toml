[package]
name = "rust-sizetree"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Disk space analyzer CLI + GUI (Rust port of Python/pytree core)"
license = "MIT"

[[bin]]
name = "rust-sizetree"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "persistence"] }
egui = "0.36"
egui-lucide = "0.1"
egui_extras = { version = "0.36", features = ["svg"] }
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[package]
name = "portscan"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "TCP port scanner CLI (Rust port of Python/pyportscanner)"
license = "MIT"

[[bin]]
name = "portscan"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

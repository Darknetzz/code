[package]
name = "prereq-doctor"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Check local development and admin prerequisites"
license = "MIT"

[[bin]]
name = "prereq-doctor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

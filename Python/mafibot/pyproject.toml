[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mafibot"
version = "0.1.0"
description = "Human-like browser autopilot for Mafiaspillet.no"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0,<2",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0,<1",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
# Monorepo: pip install -e ../webbot from Python/mafibot
webbot = []

[project.scripts]
mafibot = "mafibot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mafibot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

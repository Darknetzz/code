<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webbot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-main">
      <h1>Webbot</h1>
      <p id="health" class="muted">Loading…</p>
    </div>
    <button type="button" id="btn-help" class="help-header-btn">Help</button>
  </header>

  <nav class="tabs">
    <button type="button" class="tab active" data-tab="run">Run</button>
    <button type="button" class="tab" data-tab="builder">Builder</button>
  </nav>

  <main>
    <section id="panel-run" class="panel active">
      <div class="card">
        <div class="scenario-list-header" data-help-id="run.scenario">
          <span class="field-label">Scenarios</span>
        </div>
        <ul id="run-scenario-list" class="scenario-list" role="listbox" aria-label="Scenarios"></ul>

        <div class="row">
          <label for="run-loops" data-help-id="run.loops">Loops</label>
          <input type="number" id="run-loops" min="1" value="1" />
        </div>
        <div class="row">
          <label for="run-pause" data-help-id="run.pause">Pause between loops (sec)</label>
          <input type="number" id="run-pause" min="0" step="1" value="0" />
        </div>
        <label class="checkbox" data-help-id="run.headless">
          <input type="checkbox" id="run-headless" />
          Headless
        </label>

        <div class="actions">
          <button type="button" id="btn-start" class="primary">Start</button>
          <button type="button" id="btn-stop" disabled>Stop</button>
        </div>
        <p id="run-status" class="status muted">Idle</p>
      </div>

      <div class="card log-card">
        <h2>Log</h2>
        <pre id="log-output"></pre>
      </div>
    </section>

    <section id="panel-builder" class="panel">
      <div class="card">
        <label for="build-name" data-help-id="builder.name">Scenario name</label>
        <input type="text" id="build-name" placeholder="my_flow" />

        <label for="build-desc" data-help-id="builder.description">Description</label>
        <input type="text" id="build-desc" placeholder="Optional" />

        <label for="build-url" data-help-id="builder.start_url">Start URL</label>
        <input type="url" id="build-url" placeholder="https://example.com" />

        <div class="scenario-options-card">
          <h2 class="section-heading" data-help-id="scenario.options">Scenario options</h2>
          <label class="checkbox" data-help-id="scenario.random_delay">
            <input type="checkbox" id="build-random-between-steps" />
            Random delay between each step
          </label>
          <div id="between-steps-fields" class="step-fields scenario-options-fields hidden"></div>
        </div>

        <div class="steps-header">
          <h2 data-help-id="builder.steps">Steps</h2>
          <button type="button" id="btn-add-step">Add step</button>
        </div>
        <div id="steps-list"></div>

        <div class="actions">
          <button type="button" id="btn-save" class="primary" data-help-id="builder.save">Save scenario</button>
          <button type="button" id="btn-load" data-help-id="builder.load">Load from Run dropdown</button>
          <button type="button" id="btn-test-run" data-help-id="builder.test_run">Test run</button>
        </div>
        <p id="build-msg" class="muted"></p>
      </div>
    </section>
  </main>

  <dialog id="help-dialog" class="help-dialog" aria-labelledby="help-title">
    <div class="help-dialog-inner">
      <aside class="help-sidebar">
        <nav id="help-nav" class="help-nav" aria-label="Help topics"></nav>
      </aside>
      <div class="help-main">
        <header class="help-content-header">
          <h2 id="help-title"></h2>
        </header>
        <div id="help-body" class="help-body"></div>
        <footer class="help-footer">
          <button type="button" id="help-prev">Previous</button>
          <button type="button" id="help-next">Next</button>
          <button type="button" id="help-close" class="primary">Close</button>
        </footer>
      </div>
    </div>
  </dialog>

  <script src="/icons.js"></script>
  <script src="/help-topics.js"></script>
  <script src="/help.js"></script>
  <script src="/app.js"></script>
</body>
</html>

[tool.pytest.ini_options]
testpaths = [
    "av1/tests",
]
python_files = [
    "test_*.py",
]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [
    "**/__pycache__",
    "snapbot/chromium",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",
]

[tool.black]
line-length = 120
target-version = ["py39"]

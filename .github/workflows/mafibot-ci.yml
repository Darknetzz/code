name: mafibot-ci

on:
  push:
    paths:
      - "Python/mafibot/**"
      - ".github/workflows/mafibot-ci.yml"
  pull_request:
    paths:
      - "Python/mafibot/**"
      - ".github/workflows/mafibot-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python/mafibot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest tests/ -q

name: mafibot-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "mafibot-v*"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Python/mafibot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package, webbot, and PyInstaller
        run: |
          pip install -r requirements.txt pyinstaller msvc-runtime
          pip install -e ../webbot

      - name: Install Playwright Chromium (bundled path)
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium

      - name: Build mafibot.exe
        run: pyinstaller mafibot.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: mafibot-windows-exe
          path: Python/mafibot/dist/mafibot.exe
          if-no-files-found: error

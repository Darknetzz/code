name: rustdl-ci

on:
  push:
    paths:
      - "Rust/rustdl/**"
      - ".github/workflows/rustdl-ci.yml"
      - ".github/workflows/rustdl-release.yml"
  pull_request:
    paths:
      - "Rust/rustdl/**"
      - ".github/workflows/rustdl-ci.yml"
      - ".github/workflows/rustdl-release.yml"

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rust/rustdl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust/rustdl

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features

      - name: Install cargo-deny
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo install cargo-deny --locked

      - name: cargo deny
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo deny check

      - name: Install cargo-audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo install cargo-audit --locked

      - name: cargo audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo audit

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Rust/rustdl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust/rustdl

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features

  test-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Rust/rustdl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust/rustdl

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features

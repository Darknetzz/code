# Build Linux Zig CLIs and publish them into setupfiles (main).
#
# Required CI/CD variable on kriss/code (protected):
#   SETUPFILES_SSH_PRIVATE_KEY — deploy key with write access to kriss/setupfiles
#
# SSH defaults to gitlab.roste.org:2222 (port 22 times out from Docker runners).
# Override with SETUPFILES_SSH_HOST=gitlab01 and SETUPFILES_SSH_PORT=22 if preferred.
#
# Optional overrides:
#   SETUPFILES_SSH_HOST      (default gitlab.roste.org)
#   SETUPFILES_SSH_PORT      (default 2222)
#   SETUPFILES_PROJECT_PATH  (default kriss/setupfiles)
#   SETUPFILES_BRANCH        (default main)
#   ZIG_VERSION              (default 0.17.0)

stages:
  - build
  - publish

variables:
  ZIG_VERSION: "0.17.0"
  SETUPFILES_SSH_HOST: "gitlab.roste.org"
  SETUPFILES_SSH_PORT: "2222"
  SETUPFILES_PROJECT_PATH: "kriss/setupfiles"
  SETUPFILES_BRANCH: "main"
  FF_TIMESTAMPS: "true"

.zig_change_rules: &zig_change_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Zig/**/*
        - .gitlab-ci.yml
        - "!scripts/ci-install-zig.sh"
        - "!scripts/publish-zig-bins-to-setupfiles.sh"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Zig/**/*
        - .gitlab-ci.yml
        - "!scripts/ci-install-zig.sh"
        - "!scripts/publish-zig-bins-to-setupfiles.sh"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

build:zig:linux:
  image: debian:bookworm-slim
  stage: build
  <<: *zig_change_rules
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl ca-certificates xz-utils
    - chmod +x '!scripts/ci-install-zig.sh'
    - source '!scripts/ci-install-zig.sh'
  script:
    - |
      set -euo pipefail
      out="${CI_PROJECT_DIR}/ci-bins"
      mkdir -p "${out}"
      for tool in zgen zwhich; do
        (
          cd "Zig/${tool}"
          zig build -Doptimize=ReleaseSafe test
          zig build -Doptimize=ReleaseSafe
          install -m 0755 "zig-out/bin/${tool}" "${out}/${tool}"
        )
      done
      "${out}/zgen" --version
      "${out}/zwhich" --version
  artifacts:
    name: "zig-linux-amd64-$CI_COMMIT_SHORT_SHA"
    paths:
      - ci-bins/
    expire_in: 1 week

publish:zig:setupfiles:
  image: debian:bookworm-slim
  stage: publish
  needs:
    - job: build:zig:linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Zig/**/*
        - .gitlab-ci.yml
        - "!scripts/ci-install-zig.sh"
        - "!scripts/publish-zig-bins-to-setupfiles.sh"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git openssh-client ca-certificates
    - chmod +x '!scripts/publish-zig-bins-to-setupfiles.sh'
  script:
    - BIN_SRC="${CI_PROJECT_DIR}/ci-bins" '!scripts/publish-zig-bins-to-setupfiles.sh'
